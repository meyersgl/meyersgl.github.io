name: Build editions
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pandoc, LibreOffice and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pandoc libreoffice-writer python3-uno fonts-crosextra-carlito fonts-crosextra-caladea fonts-dejavu
      - name: Build DOCX and PDF
        run: /usr/bin/python3 -c "import uno" && PATH=/usr/bin:$PATH bash build/build.sh "${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        with:
          name: editions-${{ github.ref_name }}
          path: build/out/
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/out/*
